<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSP 真题题解</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" id="hl-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" id="hl-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
<script>
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
:root {
  --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4;
  --accent: #2563eb; --hover: #f5f5f4; --code: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --panel: #1a1a1a; --text: #e7e5e4; --muted: #a8a29e; --line: #2e2e2e;
    --accent: #60a5fa; --hover: #232323; --code: #0d1117;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --panel: #1a1a1a; --text: #e7e5e4; --muted: #a8a29e; --line: #2e2e2e;
  --accent: #60a5fa; --hover: #232323; --code: #0d1117;
}
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.theme {
  flex: none; width: 34px; height: 34px; font-size: 16px; line-height: 1; cursor: pointer; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
}
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
header h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
header p { margin: 4px 0 0; color: var(--muted); }

.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 24px 0 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button {
  border: 0; background: none; color: var(--muted); padding: 6px 14px; font: inherit; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--text); color: var(--bg); }
.search {
  flex: 1; min-width: 200px; padding: 7px 12px; font: inherit; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; outline: none;
}
.search:focus { border-color: var(--accent); }

.year { margin-top: 28px; }
.year h2 { font-size: 18px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
.col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center;
  padding: 9px 14px; color: var(--text); border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); text-decoration: none; }
.slot { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.name { min-width: 0; }
.name b { font-weight: 500; }
.name small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diff { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.empty { color: var(--muted); margin-top: 40px; text-align: center; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.crumb { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; }
article {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 32px 28px; margin-top: 20px;
}
article h2 { font-size: 20px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
article h3 { font-size: 16px; margin: 22px 0 8px; }
article table { border-collapse: collapse; margin: 12px 0; display: block; overflow-x: auto; }
article th, article td { border: 1px solid var(--line); padding: 4px 10px; }
article code { font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 1px 5px; border-radius: 4px; }
article pre { position: relative; background: var(--code); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
article pre code { display: block; padding: 14px 16px; background: none !important; }
.copy {
  position: absolute; top: 8px; right: 8px; font: 12px inherit; padding: 2px 10px; cursor: pointer;
  color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
}
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; font-size: 14px; }
.nav a { max-width: 48%; }

@media (max-width: 720px) {
  article { padding: 4px 16px 20px; }
  .wrap { padding-top: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <footer>
    题解与本站由 William 和 Claude 共同编写 ·
    GitHub <a href="https://github.com/atherauran" target="_blank" rel="noopener">atherauran</a> ·
    洛谷 <a href="https://www.luogu.com.cn/user/1752953" target="_blank" rel="noopener">willyblah</a>
  </footer>
</div>

<script src="problems.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const app = document.getElementById('app');
const state = { contest: 'CSP-J', q: '' };
const years = [...new Set(PROBLEMS.map(p => p.year))].sort((a, b) => b - a);
const byPid = Object.fromEntries(PROBLEMS.map(p => [p.pid, p]));
const luogu = pid => `https://www.luogu.com.cn/problem/${pid}`;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const dark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
const themeBtn = () => `<button class="theme" title="切换浅色/深色">${dark() ? '☀' : '☾'}</button>`;

function syncTheme() {
  document.getElementById('hl-light').disabled = dark();
  document.getElementById('hl-dark').disabled = !dark();
  document.querySelectorAll('.theme').forEach(b => b.textContent = dark() ? '☀' : '☾');
}

document.addEventListener('click', e => {
  if (!e.target.closest('.theme')) return;
  const t = dark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (err) {}
  syncTheme();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);

function diffBadge(d) {
  if (d == null) return '';
  const h = 140 - (d - 1) * 15;
  return `<span class="diff" style="color:hsl(${h} 65% 42%);background:hsl(${h} 65% 45% / .14)">${d}</span>`;
}

function match(p) {
  if (p.contest !== state.contest) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  return [p.pid, p.name, p.slot, String(p.year), ...p.tags].some(s => s.toLowerCase().includes(q));
}

function rowHtml(p) {
  return `<a class="row" href="#/${p.pid}">
    <span class="slot">${p.slot}</span>
    <span class="name"><b>${esc(p.name)}</b><small>${p.pid} · ${esc(p.tags.join('、'))}</small></span>
    ${diffBadge(p.diff)}
  </a>`;
}

function listHtml() {
  let body = '';
  for (const y of years) {
    const list = PROBLEMS.filter(p => p.year === y && match(p));
    if (list.length) body += `<section class="year"><h2>${y}</h2><div class="col">${list.map(rowHtml).join('')}</div></section>`;
  }
  return body || '<p class="empty">没有匹配的题目</p>';
}

function renderHome() {
  document.title = 'CSP 真题题解';
  const seg = ['CSP-J', 'CSP-S'].map(v => `<button data-v="${v}" class="${state.contest === v ? 'on' : ''}">${v}</button>`).join('');
  app.innerHTML = `
    <header class="head"><div><h1>CSP-J/S 历年真题题解</h1><p>${years[years.length - 1]}–${years[0]} · ${PROBLEMS.length} 题 · 右侧数字为难度（1–10）</p></div>${themeBtn()}</header>
    <div class="bar"><div class="seg">${seg}</div>
      <input class="search" placeholder="搜索题号、题名或算法标签" value="${esc(state.q)}"></div>
    <div id="list">${listHtml()}</div>`;
  const list = app.querySelector('#list'), buttons = app.querySelectorAll('.seg button');
  buttons.forEach(b => b.onclick = () => {
    state.contest = b.dataset.v;
    buttons.forEach(x => x.classList.toggle('on', x === b));
    list.innerHTML = listHtml();
  });
  app.querySelector('.search').oninput = e => { state.q = e.target.value; list.innerHTML = listHtml(); };
}

function renderMarkdown(src) {
  const math = [];
  const hold = (tex, display) => { math.push([tex, display]); return `KATEXPH${math.length - 1}END`; };
  const parts = src.split(/(```[\s\S]*?```)/);
  for (let i = 0; i < parts.length; i += 2) {
    parts[i] = parts[i].split(/(`[^`\n]*`)/).map((seg, j) => j % 2 ? seg : seg
      .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => hold(t, true))
      .replace(/\$([^$\n]+?)\$/g, (_, t) => hold(t, false))).join('');
  }
  let html = marked.parse(parts.join(''));
  return html.replace(/KATEXPH(\d+)END/g, (_, i) =>
    katex.renderToString(math[i][0], { displayMode: math[i][1], throwOnError: false }));
}

async function renderSolution(p) {
  document.title = `${p.pid} ${p.name} - CSP 真题题解`;
  state.contest = p.contest;
  const list = PROBLEMS.filter(x => x.contest === p.contest);
  const idx = list.indexOf(p), prev = list[idx - 1], next = list[idx + 1];
  app.innerHTML = `
    <div class="top"><a href="#/">← ${p.contest} 题目列表</a><span class="crumb">${p.contest} ${p.year} · ${p.slot} ${themeBtn()}</span></div>
    <h1 style="margin:0;font-size:26px">${esc(p.name)}</h1>
    <div class="meta"><span>${p.pid}</span>${diffBadge(p.diff)}${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
      <a href="${luogu(p.pid)}" target="_blank" rel="noopener">洛谷原题 ↗</a></div>
    <article><p class="empty">加载中…</p></article>
    <div class="nav">${prev ? `<a href="#/${prev.pid}">← ${prev.year} ${prev.slot} ${esc(prev.name)}</a>` : '<span></span>'}
      ${next ? `<a href="#/${next.pid}">${next.year} ${next.slot} ${esc(next.name)} →</a>` : ''}</div>`;
  window.scrollTo(0, 0);
  const article = app.querySelector('article');
  try {
    const res = await fetch(p.path.split('/').map(encodeURIComponent).join('/'));
    if (!res.ok) throw new Error(res.status);
    const md = (await res.text()).replace(/^# .*\n/, '');
    article.innerHTML = renderMarkdown(md);
    article.querySelectorAll('pre code').forEach(code => {
      hljs.highlightElement(code);
      const btn = document.createElement('button');
      btn.className = 'copy';
      btn.textContent = '复制';
      btn.onclick = () => navigator.clipboard.writeText(code.innerText).then(() => {
        btn.textContent = '已复制';
        setTimeout(() => btn.textContent = '复制', 1200);
      });
      code.parentElement.appendChild(btn);
    });
  } catch (e) {
    article.innerHTML = `<p class="empty">题解加载失败。若是直接双击打开的本地文件，请在本目录运行 <code>python3 -m http.server</code> 后访问。<br><a href="${esc(p.path)}">直接查看 Markdown</a></p>`;
  }
}

function route() {
  const p = byPid[location.hash.replace(/^#\/?/, '')];
  p ? renderSolution(p) : renderHome();
}
window.addEventListener('hashchange', route);
syncTheme();
route();
</script>
</body>
</html>
